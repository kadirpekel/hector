services:
  hector:
    image: ghcr.io/verikod/hector:latest
    container_name: hector
    ports:
      - "8080:8080"
    environment:
      - HECTOR_AUTH_SECRET=${HECTOR_AUTH_SECRET}
    volumes:
      - hector-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3

volumes:
  hector-data:
