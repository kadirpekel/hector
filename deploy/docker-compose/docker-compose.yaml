services:
  hector:
    image: ghcr.io/verikod/hector:latest
    container_name: hector
    ports:
      - "8080:8080"
    environment:
      - HECTOR_DATABASE=postgres://hector:hector@postgres:5432/hector?sslmode=disable
      - HECTOR_AUTH_SECRET=${HECTOR_AUTH_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - hector-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: hector-postgres
    environment:
      - POSTGRES_USER=hector
      - POSTGRES_PASSWORD=hector
      - POSTGRES_DB=hector
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hector"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  hector-data:
  postgres-data:
